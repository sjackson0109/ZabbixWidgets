name: Release

# Publishes a GitHub release with the module zip and its SHA-256 checksum.
#
# Start it from the Actions tab ("Run workflow" on main, with the version) and
# it tags the tested commit itself, or push a v* tag and it releases that tag.
# Either way nothing is published until the version, CHANGELOG, every check,
# the Zabbix 7.0/7.2/7.4 integration test and a byte-for-byte rebuild of the
# package have passed. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 1.0.0). Must match package.json.'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and changelog
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the release from main, not $GITHUB_REF."
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Version, manifest and CHANGELOG agree with the tag
        run: node scripts/release-check.mjs --tag "${{ steps.tag.outputs.tag }}" --notes dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/notes.md

  checks:
    name: Lint, tests, licences and dependencies
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm run check includes the browser test, which needs Chromium.
      - run: npx playwright install --with-deps chromium
      - name: Lint, tests, build, browser test, contracts document and licence inventory
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  integration:
    name: Zabbix integration
    needs: prepare
    uses: ./.github/workflows/integration.yml

  package:
    name: Reproducible package
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and package twice; the archives must be identical
        run: |
          npm run build
          npm run package
          first=$(cat dist/*.sha256)
          rm -rf dist modules/extended-charts/assets/js/zabbixwidgets-charts.js
          npm run build
          npm run package
          test "$first" = "$(cat dist/*.sha256)"
          echo "Rebuilt package is byte-identical: $first"
      - name: Archive holds the module and its licences
        run: |
          zip=$(ls dist/*.zip)
          listing=$(unzip -Z1 "$zip")
          for file in manifest.json assets/js/zabbixwidgets-charts.js LICENSE THIRD_PARTY_NOTICES.md licenses/echarts/LICENSE; do
            grep -qxF "zabbixwidgets_charts/$file" <<< "$listing" || { echo "::error::$zip is missing zabbixwidgets_charts/$file"; exit 1; }
          done
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, checks, integration, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist
      - name: Release notes
        run: |
          {
            cat dist/notes.md
            echo
            echo '### Checksum'
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > dist/release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            # Creates the tag on the commit that was tested.
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 "${target[@]}" --title "$TAG" --notes-file dist/release-notes.md
