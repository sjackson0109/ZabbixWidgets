name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: JavaScript lint
        run: npm run lint
      - name: PHP lint
        run: npm run lint:php
      - name: Unit, contract, renderer and UI tests
        run: npm test
      - name: Build bundle
        run: npm run build
      - name: Browser test of the built bundle
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Chart contracts document is current
        run: npm run docs:contracts -- --check
      - name: Licence inventory
        run: npm run licences
      - name: Versions agree and the manifest counts the charts
        run: npm run release:check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Package reproducibly (when LICENSE exists)
        if: hashFiles('LICENSE') != ''
        run: |
          npm run package
          first=$(cat dist/*.sha256)
          rm -rf dist modules/extended-charts/assets/js/zabbixwidgets-charts.js
          npm run build
          npm run package
          test "$first" = "$(cat dist/*.sha256)" && echo "Rebuilt package is byte-identical: $first"
